<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Custom Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <div>
        <h1>Unit Custom Card</h1>
        <p class="subtitle">Unit overview</p>
      </div>
      <button class="add-btn" id="addUnitBtn">+ Add Unit</button>
    </header>

    <div class="toolbar">
      <strong>Total Units: <span id="totalUnits">0</span></strong>
      <button class="filter-btn" id="filterBtn">Filter</button>
    </div>

    <main id="cardGrid" class="card-grid"></main>
  </div>

  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
