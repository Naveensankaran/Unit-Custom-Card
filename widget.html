<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Unit Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <div>
        <h1>Project Unit Status</h1>
      </div>
      <button class="add-btn" id="addUnitBtn">+ Add Unit</button>
    </header>

    <div class="toolbar">
      <div class="summary-stats" id="summaryStats">
        <div class="summary-pill total">
          <strong>Total Units: <span id="totalUnits">0</span></strong>
        </div>
        <div class="summary-pill available">
           <strong>Unsold: <span id="unsoldUnits">0</span></strong>
        </div>
        <div class="summary-pill sold">
           <strong>Sold: <span id="soldUnits">0</span></strong>
        </div>
        <div class="summary-pill owner-share">
          <strong>Owner Share: <span id="ownerShareUnits">0</span></strong>
        </div>
        <div class="summary-pill blocked">
          <strong>Blocked: <span id="blockedUnits">0</span></strong>
        </div>
        <div class="summary-pill mortgage">
          <strong>Mortgage: <span id="mortgageUnits">0</span></strong>
        </div>
      </div>
      <div class="filter-wrap">
        <button class="filter-btn" id="filterBtn">Filter</button>
        <div class="filter-panel" id="filterPanel">
          <div class="filter-row">
            <label for="projectFilter">Project</label>
            <select id="projectFilter">
              <option value="">All Projects</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="filter-clear-btn" id="filterClearBtn">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <main id="cardGrid" class="card-grid"></main>
  </div>

  <div class="modal-overlay" id="unitModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="unitModalTitle">Units</h3>
        <button class="modal-close-btn" id="unitModalCloseBtn">&times;</button>
      </div>
      <div class="modal-filter-row">
        <div class="modal-filter-item">
          <label for="modalTowerFilter">Tower</label>
          <select id="modalTowerFilter">
            <option value="">All Towers</option>
          </select>
        </div>
        <div class="modal-filter-item">
          <label for="modalFloorFilter">Floor</label>
          <select id="modalFloorFilter">
            <option value="">All Floors</option>
          </select>
        </div>
      </div>
      <div class="modal-body" id="unitModalBody"></div>
    </div>
  </div>

  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
